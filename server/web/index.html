  <script src="/web-assets/dossier.js"></script>
  <script>
    const root=document.getElementById("root"),nav=document.getElementById("nav"),toast=document.getElementById("toast");
    const state={token:localStorage.getItem("relabWebToken")||"",role:localStorage.getItem("relabWebRole")||"",testId:"",poll:0,locking:false};
    const statusLabel={created:"刚创建",a_in_progress:"答题中",a_completed:"等待 TA",b_in_progress:"TA 答题中",completed:"已完成",expired:"已过期"};
    const qs=(name)=>new URLSearchParams(location.search).get(name);
    function escapeHtml(v){const n=document.createElement("span");n.textContent=String(v??"");return n.innerHTML}
    function showToast(message,bad=false){toast.textContent=message;toast.classList.toggle("bad",bad);toast.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove("show"),2400)}
    function setSession(data){state.token=data.token;state.role=data.accessRole;localStorage.setItem("relabWebToken",data.token);localStorage.setItem("relabWebRole",data.accessRole)}
    function clearSession(){state.token="";state.role="";localStorage.removeItem("relabWebToken");localStorage.removeItem("relabWebRole")}
    async function api(path,options={}){const res=await fetch(path,{...options,headers:{"Content-Type":"application/json",...(state.token?{Authorization:`Bearer ${state.token}`}:{}) ,...(options.headers||{})}});const body=await res.json().catch(()=>({message:"网络异常"}));if(!res.ok||body.code!==0){if(res.status===401)clearSession();throw new Error(body.message||"请求失败")}return body.data}
    function layout(html,{showNav=true}={}){clearInterval(state.poll);document.querySelector(".shell")?.classList.remove("dossier-on","pretest-on");nav.hidden=!showNav;root.innerHTML=`<section class="view">${html}</section>`;window.scrollTo({top:0,behavior:"instant"})}
    function loading(){root.innerHTML='<div class="spinner"></div>'}
    let pretestBusy=false;
    function pretestSearch(on){const url=new URL(location.href);if(on)url.searchParams.set("view","pretest");else url.searchParams.delete("view");const search=url.searchParams.toString();return url.pathname+(search?`?${search}`:"")+url.hash}
    function showPretest({historyMode="push"}={}){
      layout(`<article class="pretest-page"><button class="pretest-back" id="pretestBack" type="button">← 返回</button><p class="pretest-kicker">BEFORE START · 01</p><h1 class="pretest-title" id="pretestTitle">在开始之前，<br>想先和你说几句话</h1><p class="pretest-core">你们之间，藏着一套只属于两个人的相处规律。</p><div class="pretest-rule"></div><p class="pretest-meta-en">30 QUESTIONS · 16 DIMENSIONS · 8 INDICES · 24 RELATION TYPES</p><p class="pretest-meta">30 道题 · 16 个关系维度 · 8 项关系指数 · 24 种关系原型</p><div class="pretest-copy"><p>30 道题，只是这份关系档案的入口。</p><p>每一次选择，都会慢慢勾勒出你在沟通、陪伴、安全感、独处习惯、情绪反应、冲突方式和边界感等 16 个关系维度上的倾向。等两个人都完成以后，两份画像才会真正碰在一起——形成 8 项关系指数，并从 24 种关系原型中，找到最接近你们的那一种。</p><p>我们想看的，从来不只是“合不合”，而是你们为什么会这样靠近、为什么总在某些地方错开，又怎样才能更舒服地待在彼此身边。</p></div><div class="pretest-slip">没有标准答案。按第一感觉选就好。</div><p class="pretest-aside">最好各自回答，先别偷偷替 TA 猜答案。</p><button class="pretest-go" id="pretestGo" type="button">开始看看你们　→</button></article>`,{showNav:false});
      document.querySelector(".shell")?.classList.add("pretest-on");
      document.getElementById("pretestBack").onclick=leavePretest;
      document.getElementById("pretestGo").onclick=()=>{confirmPretest()};
      if(historyMode==="push" && qs("view")!=="pretest") history.pushState({view:"pretest"},"",pretestSearch(true));
    }
    function leavePretest(){
      if(history.state && history.state.view==="pretest"){history.back();return}
      history.replaceState({},"",pretestSearch(false));
      showHome();
    }
    async function confirmPretest(){
      if(pretestBusy) return;
      pretestBusy=true;
      const go=document.getElementById("pretestGo");
      if(go) go.disabled=true;
      if(qs("view")==="pretest") history.replaceState({},"",pretestSearch(false));
      try{await startTest()}
      finally{pretestBusy=false}
    }
    function afterVerified(){
      if(window.matchMedia("(max-width:767px)").matches) showPretest();
      else showHome();
    }
    window.addEventListener("popstate",()=>{
      if(qs("invite")) return;
      if(!state.token){showAccess();return}
      if(qs("view")==="pretest" && state.role==="buyer") showPretest({historyMode:"none"});
      else if(state.role==="buyer") showHome();
    });

    async function boot(){
      const invite=qs("invite");
      if(invite){await showJoin(invite);return}
      if(state.token){try{const me=await api("/api/me");state.role=me.accessRole||state.role;if(state.role==="buyer"){if(qs("view")==="pretest") showPretest({historyMode:"none"});else showHome();return}}catch{clearSession()}}
      showAccess();
    }
    function showAccess(){layout(`<div class="access"><div><div class="card access-card"><div class="access-lock">⌁</div><h1>关系引力测试</h1><div class="access-sub">RELATIONSHIP LAB</div><form id="accessForm"><input class="field code-input" id="accessCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required><button class="btn" type="submit">验证并开始　→</button><div class="error" id="accessError"></div></form><div class="access-note">请输入购买后收到的 6 位数字验证码。验证码不能包含空格，可跨设备重复使用。</div></div><div class="disclaimer">本测试仅供娱乐和自我探索，不构成心理、医疗或专业诊断。</div></div></div>`,{showNav:false});document.getElementById("accessForm").addEventListener("submit",async e=>{e.preventDefault();const code=document.getElementById("accessCode").value;const err=document.getElementById("accessError");err.textContent="";try{e.submitter.disabled=true;const data=await api("/api/web/auth/activate",{method:"POST",body:JSON.stringify({code})});setSession(data);afterVerified()}catch(error){err.textContent=error.message;e.submitter.disabled=false}})}
    function showHome(){layout(`<div class="home-hero"><h1 class="home-title">你和 TA<em>到底是什么关系？</em></h1><div class="underline"></div><div class="hand-note">有些关系，<br>值得好好被看见。</div><div class="scrapbook"><div class="blue-paper"></div><div class="caption">Better<br>Together.<br>♡</div><img class="home-photo" src="/web-assets/home-couple-polaroid.webp" alt="两个人的关系拼贴"></div></div><div class="home-actions"><button class="btn" id="startBtn">开始一组新测试　→</button><p class="home-footnote">这不是关于某一个人的答案，而是关于两个人之间会形成怎样的关系。</p></div><div class="features"><div class="feature"><i>♧</i>了解自己</div><div class="feature"><i>♡</i>看见关系</div><div class="feature"><i>♢</i>获得建议</div></div><div class="paper-note">好的关系，<br>让我们成为更好的自己。</div><div class="disclaimer">验证码可重复发起测试 · 网页内不涉及购买<br>本测试仅供娱乐和自我探索，不构成心理、医疗或专业诊断。</div>`);document.getElementById("startBtn").onclick=()=>showPretest()}
    async function startTest(){try{loading();const test=await api("/api/tests",{method:"POST",body:"{}"});state.testId=test.id;await showQuiz(test.id)}catch(e){showToast(e.message,true);showHome()}}
    async function ensureGuest(){if(state.token)return;const data=await api("/api/web/auth/guest",{method:"POST",body:"{}"});setSession(data)}
    async function showJoin(code){layout(`<div class="page-head"><p class="kicker">INVITATION</p><h1>TA 邀请你一起测试</h1><p class="muted">完成同一套 30 道题后，你们都可以查看关系报告。</p></div><div class="card join-card"><button class="btn" id="acceptInvite">加入并开始答题</button><div class="error" id="joinError"></div></div>`,{showNav:Boolean(state.token)});document.getElementById("acceptInvite").onclick=async e=>{try{e.target.disabled=true;await ensureGuest();const test=await api("/api/tests/join",{method:"POST",body:JSON.stringify({inviteCode:code})});history.replaceState({},"",location.pathname);state.testId=test.id;await showQuiz(test.id)}catch(error){document.getElementById("joinError").textContent=error.message;e.target.disabled=false}}}
    async function showQuiz(testId){try{loading();const [pack,test]=await Promise.all([api("/api/questions"),api(`/api/tests/${testId}`)]);if(test.status==="completed"){showResult(testId);return}if(test.role==="A"&&["a_completed","b_in_progress"].includes(test.status)){showInviteResult(testId);return}const key=`relabAnswers:${testId}:${test.role}`,answers=JSON.parse(localStorage.getItem(key)||"{}");let index=Math.min(test.answeredCount,pack.questions.length-1);renderQuestion();function renderQuestion(){const q=pack.questions[index],pct=Math.round((index+1)/pack.questions.length*100);layout(`<div class="progress-meta"><span>${escapeHtml(q.scene)}</span><span>${index+1} / ${pack.questions.length}</span></div><div class="track"><div class="bar" style="width:${pct}%"></div></div><div class="qcard"><div class="scene">${escapeHtml(q.scene)}</div><h1 class="stem">${escapeHtml(q.stem)}</h1><div class="options">${q.options.map((o,i)=>`<button class="option ${answers[q.id]===o.key?"selected":""}" data-key="${o.key}"><span class="option-index">${i+1}</span><span>${escapeHtml(o.text)}</span></button>`).join("")}</div></div><button class="btn text quiz-prev" id="prevBtn" ${index===0?"disabled":""}>‹ 上一题</button><div class="disclaimer">选择后自动进入下一题</div>`);document.querySelectorAll("[data-key]").forEach(btn=>btn.onclick=async()=>{if(state.locking)return;state.locking=true;answers[q.id]=btn.dataset.key;localStorage.setItem(key,JSON.stringify(answers));btn.classList.add("selected");try{await api(`/api/tests/${testId}/answers`,{method:"PUT",body:JSON.stringify({answers:[{questionId:q.id,optionKey:btn.dataset.key}]})});if(index+1>=pack.questions.length){await api(`/api/tests/${testId}/complete`,{method:"POST",body:"{}"});localStorage.removeItem(key);if(test.role==="A")await showInviteResult(testId);else await showResult(testId)}else{index+=1;renderQuestion()}}catch(error){showToast(error.message,true)}finally{state.locking=false}});document.getElementById("prevBtn").onclick=()=>{if(index>0){index-=1;renderQuestion()}}}}catch(e){showToast(e.message,true);state.role==="buyer"?showHome():showAccess()}}
    async function checkInviteStatus(testId, manual=false){
      const button=document.getElementById("refreshInviteStatus");
      if(manual && button){button.disabled=true;button.textContent="正在刷新…"}
      try{
        const test=await api(`/api/tests/${testId}`);
        if(test.status==="completed"){clearInterval(state.poll);await showResult(testId);return true}
        if(manual) showToast("TA 还在答题，请稍后再试");
        return false;
      }catch(error){
        if(manual) showToast(error.message||"刷新失败，请检查网络后重试",true);
        return false;
      }finally{
        const currentButton=document.getElementById("refreshInviteStatus");
        if(manual && currentButton){currentButton.disabled=false;currentButton.textContent="刷新测试状态"}
      }
    }
    async function showInviteResult(testId){try{loading();const result=await api(`/api/tests/${testId}/result`);if(!result.waitingForPeer){showResult(testId);return}const inviteUrl=`${location.origin}${location.pathname}?invite=${encodeURIComponent(result.inviteCode)}`;layout(`<div class="file"><div class="personality"><p class="kicker">RELATIONSHIP FILE · YOU</p><h1>${escapeHtml(result.personality.typeName)}</h1><div class="tagline">${escapeHtml(result.personality.tagline)}</div><p class="summary">${escapeHtml(result.personality.summary)}</p></div><div class="highlights">${result.highlights.map(i=>`<div class="highlight"><div class="highlight-head"><span>${escapeHtml(i.label)}</span><span class="highlight-value">${i.value}</span></div><div class="muted">${escapeHtml(i.description)}</div></div>`).join("")}</div><div class="invite-panel"><h2>双人故事还缺一个人</h2><p class="muted">把下面的链接发给 TA，对方完成后自动生成完整报告。</p><div class="invite-url">${escapeHtml(inviteUrl)}</div><button class="btn" id="copyInvite">复制邀请链接</button><div class="waiting"><span class="pulse"></span>正在等待 TA 完成测试</div><div class="refresh-status"><p class="refresh-note">网络状态偶尔会有延迟。如果 TA 已完成答题但页面还没有更新，可以手动刷新一次。</p><button class="refresh-btn" id="refreshInviteStatus" type="button">刷新测试状态</button></div></div></div><button class="btn secondary" style="margin-top:14px" data-home>返回首页，再测一个人</button><div class="disclaimer">同一个购买验证码可以发起多组测试。</div>`);document.getElementById("copyInvite").onclick=async()=>{await navigator.clipboard.writeText(inviteUrl);showToast("邀请链接已复制")};document.getElementById("refreshInviteStatus").onclick=()=>{checkInviteStatus(testId,true)};root.querySelector("[data-home]").onclick=showHome;state.poll=setInterval(()=>{checkInviteStatus(testId)},3000)}catch(e){showToast(e.message,true);showHome()}}
    function downloadBlob(blob, fileName){
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2500);
    }
    async function saveRelationshipCard(full, teaser){
      const button = document.getElementById("saveRelationshipCard");
      if (!button || typeof window.buildRelationshipCard !== "function" || typeof html2canvas !== "function") {
        console.error(new Error("relationship card renderer missing"));
        showToast("关系卡没有生成成功，请稍后再试。", true);
        return;
      }
      button.disabled = true;
      const host = document.createElement("div");
      host.className = "rel-card-host";
      host.setAttribute("aria-hidden", "true");
      host.innerHTML = window.buildRelationshipCard(full || {}, teaser || {});
      document.body.appendChild(host);
      try {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        const card = host.querySelector(".rel-card");
        const canvas = await html2canvas(card, {
          backgroundColor: "#f6f1e6",
          scale: 1,
          width: 1080,
          height: 1440,
          windowWidth: 1200,
          windowHeight: 1600,
          useCORS: true,
          logging: false,
          scrollX: 0,
          scrollY: 0
        });
        const output = document.createElement("canvas");
        output.width = 1080;
        output.height = 1440;
        const ctx = output.getContext("2d");
        ctx.fillStyle = "#f6f1e6";
        ctx.fillRect(0, 0, 1080, 1440);
        ctx.drawImage(canvas, 0, 0, 1080, 1440);
        const blob = await new Promise((resolve) => output.toBlob(resolve, "image/png"));
        if (!blob) throw new Error("empty card blob");
        const safeName = String((teaser && teaser.relationshipName) || "关系卡").replace(/[\\/:*?"<>|\n\r]/g, "").slice(0, 40);
        downloadBlob(blob, `关系引力-关系卡-${safeName}.png`);
        showToast("关系卡已保存到当前设备");
      } catch (error) {
        console.error(error);
        showToast("关系卡没有生成成功，请稍后再试。", true);
      } finally {
        host.remove();
        const current = document.getElementById("saveRelationshipCard");
        if (current) current.disabled = false;
      }
    }
    function exportReportPdf(name){
      if (typeof window.print !== "function") {
        showToast("当前浏览器暂不支持直接导出 PDF，可以使用浏览器的打印/分享功能保存。", true);
        return;
      }
      const previous = document.title;
      const safe = String(name || "关系报告").replace(/[\\/:*?"<>|\n\r]/g, "").slice(0, 40);
      document.title = `关系引力-关系报告-${safe}`;
      let restored = false;
      const restore = () => {
        if (restored) return;
        restored = true;
        document.title = previous;
        window.removeEventListener("afterprint", restore);
      };
      window.addEventListener("afterprint", restore);
      try {
        window.print();
      } catch (error) {
        console.error(error);
        restore();
        showToast("当前浏览器暂不支持直接导出 PDF，可以使用浏览器的打印/分享功能保存。", true);
        return;
      }
      setTimeout(restore, 1500);
    }
    function bindReportActions(full, teaser){
      document.getElementById("saveRelationshipCard")?.addEventListener("click", () => saveRelationshipCard(full, teaser));
      document.getElementById("exportReportPdf")?.addEventListener("click", () => exportReportPdf(teaser && teaser.relationshipName));
    }

    async function showResult(testId){try{loading();const data=await api(`/api/tests/${testId}/relationship`),t=data.teaser;if(!data.unlocked||!data.full){layout(`<div class="card locked"><h1 class="display">报告尚未解锁</h1><p class="muted">这可能是旧版测试。请返回首页，用购买验证码重新发起一组测试。</p><button class="btn" data-home>返回首页</button></div>`);root.querySelector("[data-home]").onclick=showHome;return}const f=data.full;if(f.relationshipConfidence&&Array.isArray(f.dimensionComparison)&&window.renderRelationshipDossier){layout(window.renderRelationshipDossier(f,t)+`<div class="report-actions"><button class="report-action primary" id="saveRelationshipCard" type="button"><strong>保存关系卡</strong><small>生成一张适合分享的关系档案卡</small></button><button class="report-action secondary" id="exportReportPdf" type="button"><strong>导出完整报告</strong><small>保存为 PDF，仅保存在你的设备中</small></button>${state.role!=="guest"?'<button class="report-home" type="button" data-home>返回首页，再测一个人</button>':""}</div>`);document.querySelector(".shell")?.classList.add("dossier-on");root.querySelector("[data-home]")?.addEventListener("click",showHome);bindReportActions(f,t);root.querySelector(".dos-more")?.addEventListener("click",(event)=>{event.currentTarget.closest(".dos-sheet")?.classList.add("is-open");event.currentTarget.hidden=true});return}layout(`<div id="reportCapture" class="report-capture"><div class="report-page" data-report-page="1"><div class="card result-top"><div class="report-brand">RELATIONSHIP REPORT</div><h1 class="relationship-name">${escapeHtml(t.relationshipName)}</h1><div class="relationship-tagline">${escapeHtml(t.tagline)}</div><div class="score">${t.rapport}<small style="font-size:13px">%</small></div><div class="muted">关系默契指数</div><div class="roles"><div class="role you">你 · ${escapeHtml(t.yourTypeName)}</div><div class="role ta">TA · ${escapeHtml(t.taTypeName)}</div></div></div></div><div class="report-page" data-report-page="2"><section class="card report-section"><h2>你们最容易误解彼此的地方</h2>${f.misunderstandings.map((i,n)=>`<div class="insight"><h3>${n+1}. ${escapeHtml(i.title)}</h3><div class="perspective you"><b>你：</b>${escapeHtml(i.yourView)}</div><div class="perspective ta"><b>TA：</b>${escapeHtml(i.taView)}</div><div class="bridge">试试这样做：${escapeHtml(i.bridge)}</div></div>`).join("")}</section><section class="card report-section"><h2>矛盾发生时</h2><div class="insight"><h3>${escapeHtml(f.conflictPattern.title)}</h3><div class="perspective you"><b>你：</b>${escapeHtml(f.conflictPattern.yourReaction)}</div><div class="perspective ta"><b>TA：</b>${escapeHtml(f.conflictPattern.taReaction)}</div><div class="bridge">修复动作：${escapeHtml(f.conflictPattern.repair)}</div></div></section></div><div class="report-page" data-report-page="3"><section class="card report-section"><h2>怎样说，更容易被听懂</h2>${f.communicationGuide.map(i=>`<div class="insight"><h3>${escapeHtml(i.scenario)}</h3><div class="perspective you">${escapeHtml(i.forYou)}</div><div class="perspective ta">${escapeHtml(i.forTa)}</div><div class="muted" style="margin-top:8px">为什么：${escapeHtml(i.why)}</div></div>`).join("")}</section><section class="card report-section"><h2>相处时</h2>${f.advice.map(i=>`<div class="advice">${escapeHtml(i)}</div>`).join("")}</section><div class="paper-note">你们的差异，<br>是磨合的起点，也是彼此的礼物。</div></div></div><div class="report-actions"><button class="report-action primary" id="saveRelationshipCard" type="button"><strong>保存关系卡</strong><small>生成一张适合分享的关系档案卡</small></button><button class="report-action secondary" id="exportReportPdf" type="button"><strong>导出完整报告</strong><small>保存为 PDF，仅保存在你的设备中</small></button>${state.role!=="guest"?'<button class="report-home" type="button" data-home>返回首页，再测一个人</button>':""}</div><div class="disclaimer">本测试仅供娱乐和自我探索，不构成心理、医疗或专业诊断。</div>`);root.querySelector("[data-home]")?.addEventListener("click",showHome);bindReportActions(f,t)}catch(e){showToast(e.message,true)}}
    async function showHistory(){try{loading();const data=await api("/api/tests/mine");layout(`<div class="page-head"><p class="kicker">MY TESTS</p><h1>我的测试</h1><p class="muted">当前浏览器身份参与过的最近 30 组测试。</p></div><div class="history-list">${data.tests.length?data.tests.map(i=>`<div class="history-item" data-id="${i.id}" data-status="${i.status}"><div><b>${escapeHtml(i.relationshipName||statusLabel[i.status]||i.status)}</b><div class="muted">${i.role==="A"?"我发起":"我受邀"}</div></div><span>查看 ›</span></div>`).join(""):'<div class="empty">还没有测试记录</div>'}</div><button class="btn secondary" style="margin-top:18px" data-home>返回首页</button>`);root.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>el.dataset.status==="completed"?showResult(el.dataset.id):el.dataset.status==="a_completed"?showInviteResult(el.dataset.id):showQuiz(el.dataset.id));root.querySelector("[data-home]").onclick=state.role==="guest"?showAccess:showHome}catch(e){showToast(e.message,true);showHome()}}
    document.addEventListener("click",e=>{if(e.target.closest("[data-home]")&&e.target.closest("header"))showHome();if(e.target.closest("[data-history]"))showHistory();if(e.target.closest("[data-logout]")){clearSession();history.replaceState({},"",location.pathname);showAccess()}});
    boot().catch(e=>{showToast(e.message,true);showAccess()});
  </script>
