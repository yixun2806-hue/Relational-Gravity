    .home-hero{position:relative}.home-title{position:relative;z-index:3;margin:6px 0 0;font:700 clamp(43px,9vw,65px)/1.05 var(--serif);letter-spacing:-3px}.home-title em{display:block;color:var(--ink);font-style:normal}.underline{width:min(510px,86%);height:9px;margin-top:7px;border-radius:50%;background:var(--coral);clip-path:polygon(0 35%,18% 5%,43% 40%,68% 0,100% 48%,98% 85%,73% 62%,45% 100%,20% 58%,1% 88%);transform:rotate(-2deg)}.hand-note{position:relative;z-index:3;margin:40px 0 0 5px;color:#385b82;font:21px/1.45 var(--hand);transform:rotate(-5deg)}.scrapbook{position:relative;height:330px;margin:-60px -15px 0}.blue-paper{position:absolute;right:5px;top:55px;width:330px;height:225px;background:#afc8e8;opacity:.6;clip-path:polygon(3% 5%,93% 0,100% 88%,83% 100%,6% 94%,0 26%);transform:rotate(-7deg)}.home-photo{position:absolute;z-index:2;right:8px;top:22px;width:285px;height:350px;object-fit:contain;filter:drop-shadow(0 9px 12px rgba(53,45,36,.14));transform:rotate(3deg)}.caption{position:absolute;left:3px;top:210px;color:rgba(73,92,111,.5);font:25px/1.1 var(--hand);transform:rotate(-12deg)}.home-actions{position:relative;z-index:4;margin-top:20px}.home-actions .btn+.btn{margin-top:10px}.features{display:flex;justify-content:space-around;margin-top:28px;color:#244b77;font-size:13px}.feature{text-align:center}.feature i{display:block;margin-bottom:8px;font-style:normal;font-size:25px}.paper-note{width:min(430px,84%);margin:42px auto 0;padding:28px 30px;color:#476789;background:#eee3cf;clip-path:polygon(0 9%,7% 5%,13% 8%,22% 3%,31% 7%,39% 2%,48% 6%,58% 1%,68% 5%,78% 2%,88% 7%,100% 3%,98% 91%,91% 96%,82% 92%,72% 98%,62% 93%,52% 97%,42% 92%,31% 98%,21% 93%,11% 97%,1% 91%);font:700 17px/1.6 var(--hand);text-align:center;transform:rotate(-1deg)}
    .page-head{margin-bottom:24px}.kicker{margin-bottom:7px;color:var(--coral);font-size:11px;font-weight:700;letter-spacing:2px}.page-head h1{font:700 31px/1.25 var(--serif)}.join-card{padding:30px}.back-link{display:inline-block;margin-bottom:18px;border:0;color:var(--secondary);background:none;cursor:pointer}

    .result-top{padding:30px;text-align:center}.report-brand{color:var(--secondary);font-size:11px;font-weight:700;letter-spacing:2px}.relationship-name{margin:18px 0 4px;font:700 38px var(--serif)}.relationship-tagline{color:var(--secondary);font:18px var(--hand)}.score{display:grid;place-items:center;width:116px;height:116px;margin:22px auto 12px;border:8px solid var(--blue-soft);border-radius:50%;color:var(--deep);font:700 35px Georgia,serif}.roles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.role{padding:12px;border-radius:8px;font-size:12px;font-weight:700}.role.you{color:#2d5d98;background:var(--blue-soft)}.role.ta{color:#b85343;background:var(--coral-soft)}.report-section{margin-top:14px;padding:24px}.report-section h2{font:700 22px var(--serif)}.insight{padding:19px 0;border-top:1px solid var(--line)}.insight:first-of-type{border-top:0}.insight h3{font:700 16px/1.5 var(--serif)}.perspective{margin-top:9px;padding:12px;border-radius:6px;color:var(--secondary);font-size:13px;line-height:1.65}.perspective.you{background:rgba(78,126,184,.1)}.perspective.ta{background:rgba(239,116,94,.1)}.bridge{margin-top:9px;padding:12px;border-left:4px solid #557ba9;color:var(--ink);background:rgba(85,123,169,.09);font-size:13px;line-height:1.65}.advice{padding:10px 0;border-bottom:1px solid var(--line);color:var(--secondary);font-size:14px;line-height:1.7}.locked{padding:34px;text-align:center}.history-list{display:grid;gap:10px}.history-item{display:flex;align-items:center;justify-content:space-between;padding:17px;border:1px solid var(--line);border-radius:10px;background:rgba(250,247,239,.82);cursor:pointer}.history-item b{font-family:var(--serif)}.history-item span{color:var(--muted);font-size:12px}.empty{padding:36px;color:var(--muted);text-align:center}.toast{position:fixed;z-index:20;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));left:20px;max-width:430px;margin:auto;padding:13px 16px;border-radius:10px;color:#fff;background:#123d70;box-shadow:0 12px 30px rgba(8,45,91,.2);font-size:13px;text-align:center;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.toast.bad{background:#a34435}.spinner{width:28px;height:28px;margin:40px auto;border:3px solid var(--blue-soft);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .report-capture{background:#f5f1e8}.report-page{display:flow-root}.report-actions{margin-top:20px}.save-report-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:calc(100% - 32px);max-width:420px;min-height:44px;margin:11px auto 0;padding:0 18px;border:1px solid rgba(35,67,100,.2);border-radius:13px;color:var(--ink);background:rgba(255,255,255,.58);box-shadow:0 5px 14px rgba(43,36,28,.04);font-size:14px;font-weight:600;cursor:pointer;transition:.2s ease}.save-report-btn:hover{color:var(--deep);border-color:rgba(52,124,229,.4);background:rgba(226,236,247,.62);transform:translateY(-1px)}.save-report-btn:disabled{cursor:wait;opacity:.55;transform:none}.save-report-btn span{font-size:17px;line-height:1}.save-report-note{margin:8px 0 0;color:#9299a3;font-size:10px;line-height:1.6;text-align:center}
    .report-image-result{width:100%;margin-top:18px;padding:16px 14px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(250,247,239,.92);text-align:center}.report-image-result h2{margin:0;font:700 20px var(--serif)}.report-image-kicker{margin:6px 0 2px;color:var(--muted);font-size:12px;line-height:1.6}.report-page-card{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.report-page-label{margin:0 0 8px;color:var(--secondary);font-size:12px;font-weight:700}.report-page-frame{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#f5f1e8}.report-page-preview{display:block;width:100%;height:auto}.report-page-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.report-page-btn{min-height:44px;padding:0 12px;border:1px solid rgba(35,67,100,.2);border-radius:12px;color:var(--ink);background:rgba(255,255,255,.72);font-size:13px;font-weight:600;cursor:pointer}.report-page-btn:hover{color:var(--deep);border-color:rgba(52,124,229,.4);background:rgba(226,236,247,.62)}.download-all{display:flex;align-items:center;justify-content:center;width:100%;margin-top:14px}.report-download-hint{margin:8px 0 0;color:#9299a3;font-size:10px;line-height:1.6}

<body>
  <div class="app">
    <header class="nav" id="nav" hidden><div class="nav-inner"><button class="brand" data-home>关系引力</button><div class="nav-actions"><button class="nav-link" data-history>我的测试</button><button class="nav-link" data-logout>退出</button></div></div></header>
    <main class="shell" id="root"><div class="spinner"></div></main>
    <footer class="site-footer"><div class="site-footer-brand">关系引力</div><div class="site-footer-meta">© 2026 关系引力 · <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">陕ICP备2026009416号-2</a></div></footer>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/web-assets/dossier.js"></script>
  <script>
    const root=document.getElementById("root"),nav=document.getElementById("nav"),toast=document.getElementById("toast");
    const state={token:localStorage.getItem("relabWebToken")||"",role:localStorage.getItem("relabWebRole")||"",testId:"",poll:0,locking:false};
    const statusLabel={created:"刚创建",a_in_progress:"答题中",a_completed:"等待 TA",b_in_progress:"TA 答题中",completed:"已完成",expired:"已过期"};
    const qs=(name)=>new URLSearchParams(location.search).get(name);
    function escapeHtml(v){const n=document.createElement("span");n.textContent=String(v??"");return n.innerHTML}
    function showToast(message,bad=false){toast.textContent=message;toast.classList.toggle("bad",bad);toast.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove("show"),2400)}
    function setSession(data){state.token=data.token;state.role=data.accessRole;localStorage.setItem("relabWebToken",data.token);localStorage.setItem("relabWebRole",data.accessRole)}
    function clearSession(){state.token="";state.role="";localStorage.removeItem("relabWebToken");localStorage.removeItem("relabWebRole")}
    async function api(path,options={}){const res=await fetch(path,{...options,headers:{"Content-Type":"application/json",...(state.token?{Authorization:`Bearer ${state.token}`}:{}) ,...(options.headers||{})}});const body=await res.json().catch(()=>({message:"网络异常"}));if(!res.ok||body.code!==0){if(res.status===401)clearSession();throw new Error(body.message||"请求失败")}return body.data}
    let reportImageUrls=[];
    function clearReportImageUrls(){reportImageUrls.forEach((url)=>URL.revokeObjectURL(url));reportImageUrls=[]}
    function layout(html,{showNav=true}={}){clearReportImageUrls();clearInterval(state.poll);document.querySelector(".shell")?.classList.remove("dossier-on");nav.hidden=!showNav;root.innerHTML=`<section class="view">${html}</section>`;window.scrollTo({top:0,behavior:"instant"})}
    function loading(){root.innerHTML='<div class="spinner"></div>'}

    async function boot(){
      const invite=qs("invite");
      if(invite){await showJoin(invite);return}
      if(state.token){try{const me=await api("/api/me");state.role=me.accessRole||state.role;if(state.role==="buyer"){showHome();return}}catch{clearSession()}}
      showAccess();
    }
    function showAccess(){layout(`<div class="access"><div><div class="card access-card"><div class="access-lock">⌁</div><h1>关系引力测试</h1><div class="access-sub">RELATIONSHIP LAB</div><form id="accessForm"><input class="field code-input" id="accessCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required><button class="btn" type="submit">验证并开始　→</button><div class="error" id="accessError"></div></form><div class="access-note">请输入购买后收到的 6 位数字验证码。验证码不能包含空格，可跨设备重复使用。</div></div><div class="disclaimer">本测试仅供娱乐和自我探索，不构成心理、医疗或专业诊断。</div></div></div>`,{showNav:false});document.getElementById("accessForm").addEventListener("submit",async e=>{e.preventDefault();const code=document.getElementById("accessCode").value;const err=document.getElementById("accessError");err.textContent="";try{e.submitter.disabled=true;const data=await api("/api/web/auth/activate",{method:"POST",body:JSON.stringify({code})});setSession(data);showHome()}catch(error){err.textContent=error.message;e.submitter.disabled=false}})}
    function showHome(){layout(`<div class="home-hero"><h1 class="home-title">你和 TA<em>到底是什么关系？</em></h1><div class="underline"></div><div class="hand-note">有些关系，<br>值得好好被看见。</div><div class="scrapbook"><div class="blue-paper"></div><div class="caption">Better<br>Together.<br>♡</div><img class="home-photo" src="/web-assets/home-couple-polaroid.webp" alt="两个人的关系拼贴"></div></div><div class="home-actions"><button class="btn" id="startBtn">开始一组新测试　→</button></div><div class="features"><div class="feature"><i>♧</i>了解自己</div><div class="feature"><i>♡</i>看见关系</div><div class="feature"><i>♢</i>获得建议</div></div><div class="paper-note">好的关系，<br>让我们成为更好的自己。</div><div class="disclaimer">验证码可重复发起测试 · 网页内不涉及购买<br>本测试仅供娱乐和自我探索，不构成心理、医疗或专业诊断。</div>`);document.getElementById("startBtn").onclick=startTest}
    async function startTest(){try{loading();const test=await api("/api/tests",{method:"POST",body:"{}"});state.testId=test.id;await showQuiz(test.id)}catch(e){showToast(e.message,true);showHome()}}
    async function ensureGuest(){if(state.token)return;const data=await api("/api/web/auth/guest",{method:"POST",body:"{}"});setSession(data)}
    async function showJoin(code){layout(`<div class="page-head"><p class="kicker">INVITATION</p><h1>TA 邀请你一起测试</h1><p class="muted">完成同一套 30 道题后，你们都可以查看关系报告。</p></div><div class="card join-card"><button class="btn" id="acceptInvite">加入并开始答题</button><div class="error" id="joinError"></div></div>`,{showNav:Boolean(state.token)});document.getElementById("acceptInvite").onclick=async e=>{try{e.target.disabled=true;await ensureGuest();const test=await api("/api/tests/join",{method:"POST",body:JSON.stringify({inviteCode:code})});history.replaceState({},"",location.pathname);state.testId=test.id;await showQuiz(test.id)}catch(error){document.getElementById("joinError").textContent=error.message;e.target.disabled=false}}}
    async function showQuiz(testId){try{loading();const [pack,test]=await Promise.all([api("/api/questions"),api(`/api/tests/${testId}`)]);if(test.status==="completed"){showResult(testId);return}if(test.role==="A"&&["a_completed","b_in_progress"].includes(test.status)){showInviteResult(testId);return}const key=`relabAnswers:${testId}:${test.role}`,answers=JSON.parse(localStorage.getItem(key)||"{}");let index=Math.min(test.answeredCount,pack.questions.length-1);renderQuestion();function renderQuestion(){const q=pack.questions[index],pct=Math.round((index+1)/pack.questions.length*100);layout(`<div class="progress-meta"><span>${escapeHtml(q.scene)}</span><span>${index+1} / ${pack.questions.length}</span></div><div class="track"><div class="bar" style="width:${pct}%"></div></div><div class="qcard"><div class="scene">${escapeHtml(q.scene)}</div><h1 class="stem">${escapeHtml(q.stem)}</h1><div class="options">${q.options.map((o,i)=>`<button class="option ${answers[q.id]===o.key?"selected":""}" data-key="${o.key}"><span class="option-index">${i+1}</span><span>${escapeHtml(o.text)}</span></button>`).join("")}</div></div><button class="btn text quiz-prev" id="prevBtn" ${index===0?"disabled":""}>‹ 上一题</button><div class="disclaimer">选择后自动进入下一题</div>`);document.querySelectorAll("[data-key]").forEach(btn=>btn.onclick=async()=>{if(state.locking)return;state.locking=true;answers[q.id]=btn.dataset.key;localStorage.setItem(key,JSON.stringify(answers));btn.classList.add("selected");try{await api(`/api/tests/${testId}/answers`,{method:"PUT",body:JSON.stringify({answers:[{questionId:q.id,optionKey:btn.dataset.key}]})});if(index+1>=pack.questions.length){await api(`/api/tests/${testId}/complete`,{method:"POST",body:"{}"});localStorage.removeItem(key);if(test.role==="A")await showInviteResult(testId);else await showResult(testId)}else{index+=1;renderQuestion()}}catch(error){showToast(error.message,true)}finally{state.locking=false}});document.getElementById("prevBtn").onclick=()=>{if(index>0){index-=1;renderQuestion()}}}}catch(e){showToast(e.message,true);state.role==="buyer"?showHome():showAccess()}}
    async function checkInviteStatus(testId, manual=false){
      const button=document.getElementById("refreshInviteStatus");
      if(manual && button){button.disabled=true;button.textContent="正在刷新…"}
      try{
        const test=await api(`/api/tests/${testId}`);
        if(test.status==="completed"){clearInterval(state.poll);await showResult(testId);return true}
        if(manual) showToast("TA 还在答题，请稍后再试");
        return false;
      }catch(error){
        if(manual) showToast(error.message||"刷新失败，请检查网络后重试",true);
        return false;
      }finally{
        const currentButton=document.getElementById("refreshInviteStatus");
        if(manual && currentButton){currentButton.disabled=false;currentButton.textContent="刷新测试状态"}
      }
    }
    async function showInviteResult(testId){try{loading();const result=await api(`/api/tests/${testId}/result`);if(!result.waitingForPeer){showResult(testId);return}const inviteUrl=`${location.origin}${location.pathname}?invite=${encodeURIComponent(result.inviteCode)}`;layout(`<div class="file"><div class="personality"><p class="kicker">RELATIONSHIP FILE · YOU</p><h1>${escapeHtml(result.personality.typeName)}</h1><div class="tagline">${escapeHtml(result.personality.tagline)}</div><p class="summary">${escapeHtml(result.personality.summary)}</p></div><div class="highlights">${result.highlights.map(i=>`<div class="highlight"><div class="highlight-head"><span>${escapeHtml(i.label)}</span><span class="highlight-value">${i.value}</span></div><div class="muted">${escapeHtml(i.description)}</div></div>`).join("")}</div><div class="invite-panel"><h2>双人故事还缺一个人</h2><p class="muted">把下面的链接发给 TA，对方完成后自动生成完整报告。</p><div class="invite-url">${escapeHtml(inviteUrl)}</div><button class="btn" id="copyInvite">复制邀请链接</button><div class="waiting"><span class="pulse"></span>正在等待 TA 完成测试</div><div class="refresh-status"><p class="refresh-note">网络状态偶尔会有延迟。如果 TA 已完成答题但页面还没有更新，可以手动刷新一次。</p><button class="refresh-btn" id="refreshInviteStatus" type="button">刷新测试状态</button></div></div></div><button class="btn secondary" style="margin-top:14px" data-home>返回首页，再测一个人</button><div class="disclaimer">同一个购买验证码可以发起多组测试。</div>`);document.getElementById("copyInvite").onclick=async()=>{await navigator.clipboard.writeText(inviteUrl);showToast("邀请链接已复制")};document.getElementById("refreshInviteStatus").onclick=()=>{checkInviteStatus(testId,true)};root.querySelector("[data-home]").onclick=showHome;state.poll=setInterval(()=>{checkInviteStatus(testId)},3000)}catch(e){showToast(e.message,true);showHome()}}
    function downloadReportFile(url,fileName){
      const link=document.createElement("a");
      link.href=url;link.download=fileName;document.body.appendChild(link);link.click();link.remove();
    }
    async function shareReportPage(page){
      const file=new File([page.blob],page.name,{type:"image/png"});
      if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:"关系引力报告"})}
        catch(error){if(error?.name!=="AbortError") showToast(error.message||"分享失败，请稍后重试",true)}
        return;
      }
      downloadReportFile(page.url,page.name);
      showToast("当前浏览器不能直接分享，已改为下载");
    }
    function showReportImages(testId,blobs){
      clearReportImageUrls();
      const box=document.getElementById("reportImageResult");
      if(!box) return;
      const prefix=testId.slice(0,8);
      const pages=blobs.map((blob,index)=>{
        const url=URL.createObjectURL(blob);
        reportImageUrls.push(url);
        return {blob,url,name:`关系引力报告-${prefix}-${index+1}.png`,index};
      });
      box.hidden=false;
      box.innerHTML=`<h2>报告图片已生成</h2><p class="report-image-kicker">共 ${pages.length} 页，可以逐张预览和下载。</p>${pages.map((page)=>`<article class="report-page-card"><p class="report-page-label">第 ${page.index+1} 页预览</p><div class="report-page-frame"><img class="report-page-preview" alt="关系报告第 ${page.index+1} 页" src="${page.url}"></div><div class="report-page-actions"><button type="button" class="report-page-btn" data-download="${page.index}">下载本页</button><button type="button" class="report-page-btn" data-share="${page.index}">分享本页</button></div></article>`).join("")}<button type="button" class="report-page-btn download-all" id="downloadAllReportImages">下载全部图片</button><p class="report-download-hint">Mac 下载后可在浏览器右上角的下载列表或“下载”文件夹中找到。</p>`;
      box.querySelectorAll("[data-download]").forEach((btn)=>btn.onclick=()=>{const page=pages[Number(btn.dataset.download)];downloadReportFile(page.url,page.name)});
      box.querySelectorAll("[data-share]").forEach((btn)=>btn.onclick=()=>shareReportPage(pages[Number(btn.dataset.share)]));
      document.getElementById("downloadAllReportImages").onclick=()=>pages.forEach((page,index)=>setTimeout(()=>downloadReportFile(page.url,page.name),index*400));
      box.scrollIntoView({behavior:"smooth",block:"start"});
    }
    async function saveReportAsImage(testId){
      const button=document.getElementById("saveReportImage");
      const report=document.getElementById("reportCapture");
      if(!button||!report||typeof html2canvas!=="function"){showToast("图片组件加载失败，请刷新后重试",true);return}
      button.disabled=true;
      button.innerHTML="<span>⌛</span> 正在生成图片…";
      try{
        if(document.fonts?.ready) await document.fonts.ready;
        const images=[...report.querySelectorAll("img")];
        await Promise.all(images.map((image)=>image.complete?Promise.resolve():new Promise((resolve)=>{image.onload=resolve;image.onerror=resolve})));
        const canvas=await html2canvas(report,{backgroundColor:"#f5f1e8",scale:Math.min(window.devicePixelRatio||1,2),useCORS:true,logging:false,imageTimeout:15000,scrollX:0,scrollY:0});
        const pages=[...report.querySelectorAll("[data-report-page]")];
        if(!pages.length) throw new Error("图片生成失败");
        const scale=canvas.width/report.offsetWidth;
        const reportTop=report.getBoundingClientRect().top;
        const blobs=[];
        for(const page of pages){
          const rect=page.getBoundingClientRect();
          const top=Math.max(0,Math.round((rect.top-reportTop)*scale));
          const height=Math.max(1,Math.min(Math.round(rect.height*scale),canvas.height-top));
          const slice=document.createElement("canvas");
          slice.width=canvas.width;
          slice.height=height;
          const ctx=slice.getContext("2d");
          ctx.fillStyle="#f5f1e8";
          ctx.fillRect(0,0,slice.width,slice.height);
          ctx.drawImage(canvas,0,top,canvas.width,height,0,0,canvas.width,height);
          const blob=await new Promise((resolve)=>slice.toBlob(resolve,"image/png",0.95));
          if(!blob) throw new Error("图片生成失败");
          blobs.push(blob);
        }
        showReportImages(testId,blobs);
      }catch(error){
        if(error?.name!=="AbortError") showToast(error.message||"图片生成失败，请稍后重试",true);
      }finally{
        const currentButton=document.getElementById("saveReportImage");
        if(currentButton){currentButton.disabled=false;currentButton.innerHTML='<span aria-hidden="true">⇩</span> 保存报告为图片'}
      }
    }
    async function showResult(testId){try{loading();const data=await api(`/api/tests/${testId}/relationship`),t=data.teaser;if(!data.unlocked||!data.full){layout(`<div class="card locked"><h1 class="display">报告尚未解锁</h1><p class="muted">这可能是旧版测试。请返回首页，用购买验证码重新发起一组测试。</p><button class="btn" data-home>返回首页</button></div>`);root.querySelector("[data-home]").onclick=showHome;return}const f=data.full;if(f.relationshipConfidence&&Array.isArray(f.dimensionComparison)&&window.renderRelationshipDossier){layout(window.renderRelationshipDossier(f,t)+`<div class="report-actions">${state.role!=="guest"?'<button class="btn" data-home>返回首页，再测一个人</button>':""}<button class="save-report-btn" id="saveReportImage" type="button"><span aria-hidden="true">⇩</span>保存报告为图片</button><p class="save-report-note">图片仅保存在当前设备，不会上传个人测试内容。</p><div id="reportImageResult" class="report-image-result" hidden></div></div>`);document.querySelector(".shell")?.classList.add("dossier-on");root.querySelector("[data-home]")?.addEventListener("click",showHome);document.getElementById("saveReportImage")?.addEventListener("click",()=>saveReportAsImage(testId));root.querySelector(".dos-more")?.addEventListener("click",(event)=>{event.currentTarget.closest(".dos-sheet")?.classList.add("is-open");event.currentTarget.hidden=true});return}layout(`<div id="reportCapture" class="report-capture"><div class="report-page" data-report-page="1"><div class="card result-top"><div class="report-brand">RELATIONSHIP REPORT</div><h1 class="relationship-name">${escapeHtml(t.relationshipName)}</h1><div class="relationship-tagline">${escapeHtml(t.tagline)}</div><div class="score">${t.rapport}<small style="font-size:13px">%</small></div><div class="muted">关系默契指数</div><div class="roles"><div class="role you">你 · ${escapeHtml(t.yourTypeName)}</div><div class="role ta">TA · ${escapeHtml(t.taTypeName)}</div></div></div></div><div class="report-page" data-report-page="2"><section class="card report-section"><h2>你们最容易误解彼此的地方</h2>${f.misunderstandings.map((i,n)=>`<div class="insight"><h3>${n+1}. ${escapeHtml(i.title)}</h3><div class="perspective you"><b>你：</b>${escapeHtml(i.yourView)}</div><div class="perspective ta"><b>TA：</b>${escapeHtml(i.taView)}</div><div class="bridge">试试这样做：${escapeHtml(i.bridge)}</div></div>`).join("")}</section><section class="card report-section"><h2>矛盾发生时</h2><div class="insight"><h3>${escapeHtml(f.conflictPattern.title)}</h3><div class="perspective you"><b>你：</b>${escapeHtml(f.conflictPattern.yourReaction)}</div><div class="perspective ta"><b>TA：</b>${escapeHtml(f.conflictPattern.taReaction)}</div><div class="bridge">修复动作：${escapeHtml(f.conflictPattern.repair)}</div></div></section></div><div class="report-page" data-report-page="3"><section class="card report-section"><h2>怎样说，更容易被听懂</h2>${f.communicationGuide.map(i=>`<div class="insight"><h3>${escapeHtml(i.scenario)}</h3><div class="perspective you">${escapeHtml(i.forYou)}</div><div class="perspective ta">${escapeHtml(i.forTa)}</div><div class="muted" style="margin-top:8px">为什么：${escapeHtml(i.why)}</div></div>`).join("")}</section><section class="card report-section"><h2>相处时</h2>${f.advice.map(i=>`<div class="advice">${escapeHtml(i)}</div>`).join("")}</section><div class="paper-note">你们的差异，<br>是磨合的起点，也是彼此的礼物。</div></div></div><div class="report-actions">${state.role!=="guest"?'<button class="btn" data-home>返回首页，再测一个人</button>':""}<button class="save-report-btn" id="saveReportImage" type="button"><span aria-hidden="true">⇩</span>保存报告为图片</button><p class="save-report-note">图片仅保存在当前设备，不会上传个人测试内容。</p><div id="reportImageResult" class="report-image-result" hidden></div></div><div class="disclaimer">本测试仅供娱乐和自我探索，不构成心理、医疗或专业诊断。</div>`);root.querySelector("[data-home]")?.addEventListener("click",showHome);document.getElementById("saveReportImage")?.addEventListener("click",()=>saveReportAsImage(testId))}catch(e){showToast(e.message,true)}}
    async function showHistory(){try{loading();const data=await api("/api/tests/mine");layout(`<div class="page-head"><p class="kicker">MY TESTS</p><h1>我的测试</h1><p class="muted">当前浏览器身份参与过的最近 30 组测试。</p></div><div class="history-list">${data.tests.length?data.tests.map(i=>`<div class="history-item" data-id="${i.id}" data-status="${i.status}"><div><b>${escapeHtml(i.relationshipName||statusLabel[i.status]||i.status)}</b><div class="muted">${i.role==="A"?"我发起":"我受邀"}</div></div><span>查看 ›</span></div>`).join(""):'<div class="empty">还没有测试记录</div>'}</div><button class="btn secondary" style="margin-top:18px" data-home>返回首页</button>`);root.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>el.dataset.status==="completed"?showResult(el.dataset.id):el.dataset.status==="a_completed"?showInviteResult(el.dataset.id):showQuiz(el.dataset.id));root.querySelector("[data-home]").onclick=state.role==="guest"?showAccess:showHome}catch(e){showToast(e.message,true);showHome()}}
    document.addEventListener("click",e=>{if(e.target.closest("[data-home]")&&e.target.closest("header"))showHome();if(e.target.closest("[data-history]"))showHistory();if(e.target.closest("[data-logout]")){clearSession();history.replaceState({},"",location.pathname);showAccess()}});
    boot().catch(e=>{showToast(e.message,true);showAccess()});
  </script>
  <script src="/web-assets/vendor/html2canvas.min.js"></script>
